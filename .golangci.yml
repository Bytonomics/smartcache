# golangci-lint configuration for smartcache (v2 format)
#
# Run: golangci-lint run ./...
# or: make lint

version: "2"

linters:
  default: none
  enable:
    # Core linters
    - govet
    - staticcheck
    - unused
    # Error handling
    - errcheck
    - errorlint
    # Code quality
    - gocritic
    - gocyclo
    - gocognit
    - dupl
    - misspell
    # Security
    - gosec
    # Style
    - goconst
    - godox
    - revive
    - whitespace
    # Testing
    - testifylint

  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gosec:
      severity: medium
      confidence: medium
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting
        - whyNoLint
    godox:
      keywords:
        - TODO
        - FIXME
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Allow TODOs with any issue reference format: TODO(tracking-ref):
      - linters:
          - godox
        text: "TODO\\([^)]+\\):"
      # Allow TODO/FIXME and code duplication in test code
      - path: _test\.go
        linters:
          - godox
          - dupl
          - goconst
          - revive
    paths:
      - vendor
      - third_party
      - testdata

issues:
  # golangci-lint's defaults (max-issues-per-linter: 50, max-same-issues: 3)
  # silently truncate output once a linter accumulates that many hits, hiding
  # real violations behind a misleadingly small reported count. Disabled so
  # every run shows the true, complete issue list.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Bytonomics/smartcache
  exclusions:
    paths:
      - vendor
      - third_party

run:
  timeout: 5m
  tests: true
